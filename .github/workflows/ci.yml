name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # release.yml runs the whole suite again on the commit it is about to release.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements.txt -r requirements-bacnet.txt -r requirements-web.txt -r requirements-dev.txt -c constraints.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the supported floor; 3.14 is what we recommend running.
        python-version: ["3.13", "3.14"]
        # The BACnet driver is an optional extra. Run the suite both with and
        # without BACpypes3 installed, so neither the lazy import nor the
        # "skipped" path silently rots. With it installed, the simulated-
        # controller tests talk real BACnet/IP over loopback.
        bacnet: [ "with-bacnet", "without-bacnet" ]
    name: py${{ matrix.python-version }} (${{ matrix.bacnet }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-web.txt -r requirements-dev.txt -c constraints.txt
      - name: Install BACpypes3
        if: matrix.bacnet == 'with-bacnet'
        run: pip install -r requirements-bacnet.txt -c constraints.txt
      - name: Byte-compile
        run: python -m compileall -q main.py editor.py Test.py bassync tests
      - name: Run offline tests
        run: python -m pytest --cov=bassync --cov-report=term-missing:skip-covered
      - name: CLI smoke test
        run: |
          python main.py --list-drivers
          python main.py --version
          python -m bassync.scheduler 29:00 && exit 1 || test $? -eq 2
          python -m bassync.service --version
          # No service running here, so the health check must say so.
          python -m bassync.service --health && exit 1 || test $? -eq 1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck docker-entrypoint.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit (pinned versions)
        run: |
          pip install pip-audit
          pip-audit -r constraints.txt

  package:
    name: pip install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the package
        run: pip install ".[bacnet,web]" -c constraints.txt
      - name: Console scripts work outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          bas-sync --version
          bas-sync --list-drivers
          bas-sync-service --version
          # The web UI's templates and static files are in the package.
          python -c "import bassync.web as w, pathlib; d = pathlib.Path(w.__file__).parent; assert (d / 'templates' / 'base.html').is_file() and (d / 'static' / 'app.js').is_file()"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t 25live-bas-sync:ci .
      - name: Smoke test — one-shot runs
        run: |
          docker run --rm 25live-bas-sync:ci --version
          docker run --rm 25live-bas-sync:ci sync --list-drivers
          # A bad SYNC_AT must stop the service with exit 2, not crash-loop.
          docker run --rm -e SYNC_AT=29:00 25live-bas-sync:ci && exit 1 || test $? -eq 2
          # A named volume at /app/state must be writable by the user it drops to.
          docker run --rm -v ci-state:/app/state 25live-bas-sync:ci \
            sh -c 'touch /app/state/probe && test "$(id -u)" != 0 && echo state volume writable'
          # It runs as the owner of the mounted config folder, so files saved
          # from the web UI stay the host user's.
          mkdir -p ci-config
          test "$(docker run --rm -v "$PWD/ci-config:/config" 25live-bas-sync:ci id -u)" = "$(id -u)"
      - name: Smoke test — the service and its web UI
        run: |
          docker run -d --name svc --init --network host -v "$PWD/ci-config:/config" \
            -e BAS_WEB_PASSWORD=ci-password-1234 -e BAS_WEB_PORT=18080 \
            25live-bas-sync:ci serve
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/login | grep -q "Sign in"
          # Everything else needs the password.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/status)" = 401
          docker exec svc python -m bassync.service --health
          docker stop svc
          test "$(docker inspect -f '{{.State.ExitCode}}' svc)" = 0
          docker logs svc 2>&1 | grep -q "service stopped"
