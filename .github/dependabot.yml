# Keep the pinned dependencies, the Actions, and the Docker base image current.
# Each update arrives as a PR that CI tests against the full matrix — including
# the simulated-controller BACnet tests — before anyone merges it.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    # The image stays on the recommended Python (see the Dockerfile) until
    # PyYAML ships wheels for the next one; remove this then.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
