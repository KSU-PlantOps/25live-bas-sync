{% extends "base.html" %}
{% block title %}Sync {{ local_time(run.started) }}{% endblock %}
{% block body %}
<h1><span class="{{ 'ok' if run.ok else 'bad' }}">{{ 'OK' if run.ok else 'FAILED' }}</span> — sync {{ local_time(run.started) }}</h1>
<p>{{ run.subject }}</p>
<p class="actions">
  <a class="button" href="{{ url_for('run_csv', run_id=run.id) }}">Download every window (CSV)</a>
  <a class="button" href="{{ url_for('runs') }}">All syncs</a>
</p>
<iframe class="report" src="{{ url_for('run_report', run_id=run.id) }}" title="The run report" sandbox></iframe>
<details class="card"><summary>Plain-text report</summary><pre class="output">{{ run.text }}</pre></details>
{% endblock %}
