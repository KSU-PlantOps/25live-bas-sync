<table class="list">
  {% for var, purpose, source in secrets %}
    <tr><td><code>{{ var }}</code></td><td>{{ purpose }}</td>
      <td>{% if source == 'environment' %}<span class="ok">set in the environment</span>
          {% elif source %}<span class="ok">set here</span>
          {% else %}<span class="bad">not set</span>{% endif %}</td>
      <td>{% if can('edit_passwords') and source != 'environment' %}
        <form method="post" action="{{ url_for('password_set') }}" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">
          <input type="hidden" name="name" value="{{ var }}">
          <input type="hidden" name="back" value="{{ back | default('connection') }}">
          <input type="password" name="value" autocomplete="new-password" aria-label="New value for {{ var }}"
                 placeholder="{{ 'new password' if source else 'password' }}">
          <button>Set</button>
          {% if source %}<button name="clear" value="1" class="danger">Clear</button>{% endif %}
        </form>
      {% endif %}</td></tr>
  {% endfor %}
</table>
